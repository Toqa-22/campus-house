<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app.js"></script>
    <style>
        body { font-family: Georgia, Times, 'Times New Roman', serif; background-color: rgb(225, 225, 222); padding: 20px; }
        section { margin-bottom: 2rem; }
    </style>
</head>
<body>

<section>
    <h2>Insert Quiz Result</h2>
    <form id="insertForm">
        Score: <input type="number" name="score" required><br>
        Total: <input type="number" name="total" required><br>
        <button type="submit">Insert</button>
    </form>
    <p id="insertMessage"></p>
</section>

<section>
    <h2>Delete Quiz Result</h2>
    <form id="deleteForm">
        Quiz ID to Delete: <input type="number" name="deleteId" required>
        <button type="submit">Delete</button>
    </form>
    <p id="deleteMessage"></p>
</section>

<section>
    <h2>Search Results</h2>
    <form id="searchForm">
        Minimum Score:
        <input type="number" name="minScore" required>
        <button type="submit">Search</button>
    </form>
    <div id="searchResults"></div>
</section>

<section>
    <br><br>
    <a href="Questionnaire.html">
        <button type="button">Go back</button>
    </a>
</section>

<script>
    const columns = [
        { key: "id", label: "ID" },
        { key: "score", label: "Score" },
        { key: "total", label: "Total" }
    ];

    document.getElementById("insertForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const form = event.target;
        const score = parseInt(form.score.value, 10);
        const total = parseInt(form.total.value, 10);
        if (score >= 0 && total > 0) {
            DB.insert("quiz_results", { score: score, total: total });
            document.getElementById("insertMessage").textContent = "Quiz result inserted.";
            form.reset();
        } else {
            document.getElementById("insertMessage").textContent = "Enter valid score and total.";
        }
    });

    document.getElementById("deleteForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const id = event.target.deleteId.value;
        const ok = DB.deleteById("quiz_results", id);
        document.getElementById("deleteMessage").textContent = ok ? ("Deleted Quiz Result ID: " + id) : "Error deleting record.";
        event.target.reset();
    });

    document.getElementById("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const minScore = parseInt(event.target.minScore.value, 10);
        const results = DB.search("quiz_results", r => r.score >= minScore);
        const container = document.getElementById("searchResults");
        if (results.length === 0) {
            container.innerHTML = "<p>No results found.</p>";
        } else {
            renderTable(container, columns, results);
        }
    });
</script>

</body>
</html>
