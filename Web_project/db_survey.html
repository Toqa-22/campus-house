<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app.js"></script>
    <style>
        body { font-family: Georgia, Times, 'Times New Roman', serif; background-color: rgb(225, 225, 222); padding: 20px; }
        section { margin-bottom: 2rem; }
    </style>
</head>
<body>

<section>
    <h2>Insert Feedback</h2>
    <form id="insertForm">
        College: <input type="text" name="college" required><br>
        Year: <input type="text" name="year" required><br>
        Frequency: <input type="text" name="freq" required><br>
        Quality: <input type="text" name="quality" required><br>
        Taste: <input type="text" name="taste" required><br>
        Food: <input type="text" name="food" required><br>
        Drinks: <input type="text" name="drinks"><br>
        Suggestions: <textarea name="suggestions"></textarea><br>
        <button type="submit">Insert</button>
    </form>
    <p id="insertMessage"></p>
</section>

<section>
    <h2>Search Feedback by Frequency</h2>
    <form id="searchForm">
        Frequency: <input type="text" name="searchUrgency" required>
        <button type="submit">Search</button>
    </form>
    <div id="searchResults"></div>
</section>

<section>
    <h2>Delete Feedback</h2>
    <form id="deleteForm">
        Record ID to Delete: <input type="number" name="deleteId" required>
        <button type="submit">Delete</button>
    </form>
    <p id="deleteMessage"></p>
</section>

<section>
    <br><br>
    <a href="Survey.html">
        <button type="button">Go back</button>
    </a>
</section>

<script>
    const columns = [
        { key: "id", label: "ID" },
        { key: "college", label: "College" },
        { key: "year", label: "Year" },
        { key: "freq", label: "Freq" },
        { key: "quality", label: "Quality" },
        { key: "taste", label: "Taste" },
        { key: "food", label: "Food" },
        { key: "drinks", label: "Drinks" },
        { key: "suggestions", label: "Suggestions" }
    ];

    document.getElementById("insertForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const form = event.target;
        if (!form.college.value || !form.year.value || !form.freq.value || !form.quality.value || !form.taste.value || !form.food.value) {
            document.getElementById("insertMessage").textContent = "All required fields must be filled.";
            return;
        }
        DB.insert("food_feedback", {
            college: form.college.value,
            year: form.year.value,
            freq: form.freq.value,
            quality: form.quality.value,
            taste: form.taste.value,
            food: form.food.value,
            drinks: form.drinks.value,
            suggestions: form.suggestions.value
        });
        document.getElementById("insertMessage").textContent = "Inserted successfully.";
        form.reset();
    });

    document.getElementById("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const freq = event.target.searchUrgency.value;
        const results = DB.search("food_feedback", r => r.freq === freq);
        renderTable(document.getElementById("searchResults"), columns, results);
    });

    document.getElementById("deleteForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const id = event.target.deleteId.value;
        const ok = DB.deleteById("food_feedback", id);
        document.getElementById("deleteMessage").textContent = ok ? ("Deleted record ID: " + id) : "Error deleting record.";
        event.target.reset();
    });
</script>

</body>
</html>
