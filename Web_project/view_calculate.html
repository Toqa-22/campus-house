<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app.js"></script>
    <style>
        body { font-family: Georgia, Times, 'Times New Roman', serif; background-color: rgb(225, 225, 222); padding: 20px; }
    </style>
</head>
<body>
    <h2>All Bills</h2>
    <div id="table"></div>
    <br><br>
    <a href="calculate.html">
        <button type="button">Go back</button>
    </a>

    <script>
        const bills = DB.getAll("bills").map(b => ({
            basicItems: b.basicItems,
            specialItems: b.specialItems,
            wantDelivery: b.wantDelivery,
            total: (typeof b.total === "number" ? b.total.toFixed(3) : b.total)
        }));
        renderTable(
            document.getElementById("table"),
            [
                { key: "basicItems", label: "Basic Items" },
                { key: "specialItems", label: "Special Items" },
                { key: "wantDelivery", label: "Delivery" },
                { key: "total", label: "Total (OMR)" }
            ],
            bills
        );
    </script>
</body>
</html>
